<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WR :: SYNAPSE_COMMAND_v77</title>
    <style>
        :root { --neon: #0ff; --pass: #0f0; --fail: #f00; --warn: #ff0; --airlock: #0af; --bg: #010101; --panel: #080808; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        
        #command-grid {
            display: grid;
            grid-template-columns: 320px 1fr 350px;
            grid-template-rows: 60px 1fr 100px;
            height: 100vh; width: 100vw;
        }

        /* HEADER & STATUS */
        header { grid-column: 1 / span 3; border-bottom: 1px solid var(--neon); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: #000; z-index: 1000; }
        .logo { font-weight: bold; letter-spacing: 4px; font-size: 18px; text-shadow: 0 0 10px var(--neon); }
        #connection-status { font-size: 10px; padding: 4px 8px; border: 1px solid var(--neon); transition: all 0.3s; }
        .online { color: var(--pass); border-color: var(--pass) !important; box-shadow: 0 0 5px var(--pass); }

        /* SIDEBARS */
        aside { background: var(--panel); border-right: 1px solid #111; display: flex; flex-direction: column; overflow: hidden; }
        #intel-sidebar { border-right: none; border-left: 1px solid #111; }
        .scroll-area { flex-grow: 1; overflow-y: auto; padding: 15px; }
        .label { font-size: 9px; color: #444; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #111; padding-bottom: 5px; }

        /* THE REACTOR STAGE */
        #stage { position: relative; grid-row: 2; grid-column: 2; overflow: hidden; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        #network-canvas { width: 100%; height: 100%; }
        
        /* HEATMAP GLOW OVERLAY */
        #heatmap-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transition: background 0.5s; z-index: 5; }

        /* LIVE FEEDS */
        .log-entry { font-size: 10px; padding: 4px; border-bottom: 1px solid #111; color: #666; transition: color 0.3s; }
        .log-entry.new { color: var(--neon); }
        .brief-card { padding: 10px; margin-bottom: 8px; background: rgba(0,255,255,0.03); border-left: 3px solid var(--airlock); font-size: 11px; transition: all 0.3s; }
        .brief-card:hover { background: rgba(0,255,255,0.08); }
        .status-pill { font-size: 8px; padding: 2px 4px; border-radius: 2px; float: right; }

        /* DVR FOOTER */
        footer { grid-column: 1 / span 3; border-top: 1px solid #111; background: #000; display: flex; flex-direction: column; }
        #timeline { width: 100%; height: 12px; background: #111; cursor: pointer; position: relative; }
        #playhead { width: 0%; height: 100%; background: var(--neon); box-shadow: 0 0 15px var(--neon); transition: width 0.1s linear; }
        #dvr-ui { display: flex; align-items: center; justify-content: space-around; padding: 10px; }
        
        /* UI HELPERS */
        .btn { background: #000; color: var(--neon); border: 1px solid var(--neon); padding: 5px 15px; cursor: pointer; font-size: 10px; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: var(--neon); color: #000; }
        
        /* NODE INSPECTOR */
        #node-inspector { position: absolute; bottom: 20px; right: 20px; width: 250px; background: rgba(0,0,0,0.9); padding: 10px; font-size: 10px; border: 1px solid #222; display: none; z-index: 100; }
        #node-inspector pre { background: #000; padding: 5px; overflow-x: auto; font-size: 9px; }
        
        /* SCROLLBAR STYLING */
        .scroll-area::-webkit-scrollbar, #ledger-logs::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-track, #ledger-logs::-webkit-scrollbar-track { background: #000; }
        .scroll-area::-webkit-scrollbar-thumb, #ledger-logs::-webkit-scrollbar-thumb { background: #222; }
        .scroll-area::-webkit-scrollbar-thumb:hover, #ledger-logs::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body>

<div id="command-grid">
    <header>
        <div class="logo">WR :: SYNAPSE_v77</div>
        <div id="connection-status">WS_DISCONNECTED</div>
        <div style="font-size: 10px;">LEDGER_TICK: <span id="lbl-tick" style="font-size: 16px; font-weight: bold;">0</span></div>
    </header>

    <aside id="airlock-sidebar">
        <div class="scroll-area">
            <div class="label">🛰️ Airlock Monitor</div>
            <div id="active-capsules">
                <div style="text-align: center; color: #333; margin-top: 20px; font-size: 10px;">Waiting for Ingress...</div>
            </div>
            
            <div class="label" style="margin-top: 30px;">🔧 System Controls</div>
            <button class="btn" style="width: 100%;" onclick="toggleStream()" id="btn-stream">⏸ PAUSE STREAM</button>
            <button class="btn" style="width: 100%; margin-top: 5px;" onclick="network.fit()">🎥 RE-CENTER</button>
            <button class="btn" style="width: 100%; margin-top: 5px;" onclick="clearGraph()">🗑️ CLEAR GRAPH</button>
            
            <div class="label" style="margin-top: 30px;">📊 Statistics</div>
            <div style="font-size: 10px;">
                <div style="padding: 5px 0; border-bottom: 1px solid #111;">
                    <span>Total Nodes:</span> <span id="stat-nodes" style="float: right; color: var(--neon);">0</span>
                </div>
                <div style="padding: 5px 0; border-bottom: 1px solid #111;">
                    <span>Capsules:</span> <span id="stat-capsules" style="float: right; color: var(--neon);">0</span>
                </div>
                <div style="padding: 5px 0; border-bottom: 1px solid #111;">
                    <span>Approved:</span> <span id="stat-approved" style="float: right; color: var(--pass);">0</span>
                </div>
                <div style="padding: 5px 0; border-bottom: 1px solid #111;">
                    <span>Failed:</span> <span id="stat-failed" style="float: right; color: var(--fail);">0</span>
                </div>
            </div>
        </div>
    </aside>

    <main id="stage">
        <div id="heatmap-overlay"></div>
        <div id="network-canvas"></div>
        <div id="node-inspector">
            <div style="text-align: right; cursor: pointer; color: #666;" onclick="closeInspector()">✕</div>
            <div id="inspector-content"></div>
        </div>
    </main>

    <aside id="intel-sidebar">
        <div class="scroll-area">
            <div class="label">📋 Briefing Feed</div>
            <div id="briefing-feed"></div>

            <div class="label" style="margin-top: 25px;">🔥 Operational Heat</div>
            <div id="heat-stats" style="font-size: 20px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 10px var(--neon);">0%</div>
            <div style="font-size: 9px; color: #555;">Heat intensity reflects ledger activity</div>
            
            <div class="label" style="margin-top: 20px;">📜 Unified Ledger Logs</div>
            <div id="ledger-logs" style="height: 200px; overflow-y: auto; background: #000; border: 1px solid #111; padding: 5px;"></div>
        </div>
    </aside>

    <footer>
        <div id="timeline" onclick="seekTimeline(event)"><div id="playhead"></div></div>
        <div id="dvr-ui">
            <button class="btn" onclick="jumpToTick(0)">|<<</button>
            <div id="lbl-total-events" style="font-size: 10px; color: #555;">0 EVENTS STORED</div>
            <button class="btn" onclick="location.reload()" style="color: var(--fail); border-color: var(--fail);">💥 PURGE</button>
        </div>
    </footer>
</div>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<script>
    // --- 1. CONFIG & STATE ---
    let allEvents = [], currentTick = 0, isStreamActive = true, heatIntensity = 0;
    let capsuleCount = 0, approvedCount = 0, failedCount = 0;
    const wsUrl = 'ws://localhost:4001';
    let socket;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 10;

    // --- 2. GRAPH INITIALIZATION ---
    const nodes = new vis.DataSet([]);
    const edges = new vis.DataSet([]);
    const network = new vis.Network(document.getElementById('network-canvas'), { nodes, edges }, {
        physics: { 
            stabilization: false, 
            barnesHut: { 
                gravitationalConstant: -2000, 
                centralGravity: 0.3,
                springLength: 100,
                springConstant: 0.04
            } 
        },
        nodes: { 
            font: { color: '#0ff', face: 'monospace', size: 12 }, 
            borderWidth: 2, 
            color: { border: '#0ff', background: '#000' } 
        },
        edges: { 
            width: 1, 
            color: '#111', 
            smooth: { type: 'continuous' },
            arrows: { to: { enabled: true, scaleFactor: 0.5 } }
        }
    });

    // --- 3. REAL-TIME WEBSOCKET BRIDGE ---
    function connectWS() {
        socket = new WebSocket(wsUrl);
        const statusEl = document.getElementById('connection-status');

        socket.onopen = () => { 
            statusEl.innerText = 'WS_CONNECTED'; 
            statusEl.className = 'online';
            reconnectAttempts = 0;
            logLedger('SYSTEM', 'WebSocket Link Established.');
        };

        socket.onmessage = (msg) => {
            if (!isStreamActive) return; // Respect pause state
            
            const data = JSON.parse(msg.data);
            
            if (data.type === 'capsule_ingress') {
                processCapsule(data.capsule);
            } else if (data.type === 'ledger_update') {
                processLedgerUpdate(data.entry);
            } else if (data.type === 'capsule_status') {
                updateNodeStatus(data.id, data.status);
            }
        };

        socket.onerror = (error) => {
            logLedger('ERROR', 'WebSocket error occurred');
        };

        socket.onclose = () => {
            statusEl.innerText = 'WS_DISCONNECTED';
            statusEl.className = '';
            logLedger('SYSTEM', 'WebSocket connection closed');
            
            // Auto-reconnect with exponential backoff
            if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                reconnectAttempts++;
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                logLedger('SYSTEM', `Reconnecting in ${delay/1000}s... (Attempt ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
                setTimeout(connectWS, delay);
            } else {
                logLedger('ERROR', 'Max reconnection attempts reached. Please refresh page.');
            }
        };
    }

    // --- 4. CORE ENGINE LOGIC ---
    function processCapsule(capsule) {
        capsuleCount++;
        logLedger('AIRLOCK', `Ingesting Capsule: ${capsule.id} (${capsule.nodes.length} nodes)`);
        
        capsule.nodes.forEach(n => {
            // Lifecycle mapping
            let color = '#0af'; // In Airlock
            let shape = 'dot';
            let size = 15;
            
            if (n._fx === 'ghost_new') {
                color = '#f0f';
                shape = 'diamond';
                size = 20;
            }
            
            nodes.update({ 
                id: n.id, 
                label: n.type, 
                color: { border: color, background: '#000' },
                shape: shape,
                size: size,
                payload: n.payload,
                status: 'in_airlock',
                title: `${n.type}\nStatus: in_airlock\nPriority: ${n.payload.priority || 'N/A'}`
            });
            
            if (n.parent) {
                edges.update({ 
                    id: `${n.parent}_${n.id}`,
                    from: n.parent, 
                    to: n.id,
                    color: { color: '#222', highlight: '#0ff' }
                });
            }
        });

        // Highlight new ingress with pulse effect
        const rootId = capsule.nodes[0].id;
        network.selectNodes([rootId]);
        setTimeout(() => network.unselectAll(), 1000);

        allEvents.push(...capsule.nodes);
        updateDVR();
        updateBriefing(capsule);
        updateStats();
    }

    function processLedgerUpdate(entry) {
        currentTick++;
        document.getElementById('lbl-tick').innerText = currentTick;
        logLedger('SYNAPSE', entry.message);
        
        // Dynamic Heat Scaling
        heatIntensity = Math.min(heatIntensity + 10, 100);
        updateHeatUI();
        
        // Pulse existing nodes based on heat
        nodes.forEach(n => {
            const scale = 15 + (heatIntensity / 5);
            nodes.update({ id: n.id, size: scale });
        });

        // Cooling effect over time
        setTimeout(() => {
            heatIntensity = Math.max(heatIntensity - 5, 0);
            updateHeatUI();
        }, 3000);
    }

    function updateNodeStatus(id, status) {
        const colors = { 
            in_airlock: '#0af', 
            approved: '#0f0', 
            archived: '#555', 
            failed: '#f00' 
        };
        
        const node = nodes.get(id);
        if (!node) return;
        
        nodes.update({ 
            id: id, 
            color: { border: colors[status] || '#0ff', background: '#000' }, 
            status: status,
            title: `${node.label}\nStatus: ${status}\nPriority: ${node.payload?.priority || 'N/A'}`
        });
        
        logLedger('STATUS', `Node ${id} moved to ${status.toUpperCase()}`);
        
        // Update statistics
        if (status === 'approved') approvedCount++;
        if (status === 'failed') failedCount++;
        updateStats();
    }

    // --- 5. UI & DVR UTILS ---
    function updateHeatUI() {
        const heatEl = document.getElementById('heat-stats');
        heatEl.innerText = `${Math.round(heatIntensity)}%`;
        
        // Color coding based on intensity
        if (heatIntensity > 70) {
            heatEl.style.color = 'var(--fail)';
            heatEl.style.textShadow = '0 0 15px var(--fail)';
        } else if (heatIntensity > 40) {
            heatEl.style.color = 'var(--warn)';
            heatEl.style.textShadow = '0 0 15px var(--warn)';
        } else {
            heatEl.style.color = 'var(--neon)';
            heatEl.style.textShadow = '0 0 10px var(--neon)';
        }
        
        document.getElementById('heatmap-overlay').style.background = 
            `radial-gradient(circle, rgba(0,255,255,${heatIntensity/500}) 0%, transparent 70%)`;
    }

    function logLedger(source, msg) {
        const logs = document.getElementById('ledger-logs');
        const div = document.createElement('div');
        div.className = 'log-entry new';
        div.innerText = `[${new Date().toLocaleTimeString()}] [${source}] ${msg}`;
        logs.prepend(div);
        setTimeout(() => div.classList.remove('new'), 2000);
        
        // Limit to 100 entries
        while (logs.children.length > 100) {
            logs.removeChild(logs.lastChild);
        }
    }

    function updateBriefing(capsule) {
        const feed = document.getElementById('briefing-feed');
        const div = document.createElement('div');
        div.className = 'brief-card';
        
        const ghostCount = capsule.nodes.filter(n => n._fx === 'ghost_new').length;
        const statusColor = ghostCount > 0 ? '#f0f' : '#0af';
        
        div.innerHTML = `
            <span class="status-pill" style="border: 1px solid ${statusColor}; color: ${statusColor};">AIRLOCK</span>
            <strong>CAPSULE_${capsule.id.substring(8)}</strong><br>
            Nodes: ${capsule.nodes.length} | Ghosts: ${ghostCount} | Source: Synapse_Mesh
        `;
        feed.prepend(div);
        
        // Limit to 50 briefings
        while (feed.children.length > 50) {
            feed.removeChild(feed.lastChild);
        }
    }

    function updateStats() {
        document.getElementById('stat-nodes').innerText = nodes.length;
        document.getElementById('stat-capsules').innerText = capsuleCount;
        document.getElementById('stat-approved').innerText = approvedCount;
        document.getElementById('stat-failed').innerText = failedCount;
    }

    function updateDVR() {
        document.getElementById('lbl-total-events').innerText = `${allEvents.length} EVENTS STORED`;
        document.getElementById('playhead').style.width = (currentTick / Math.max(1, allEvents.length) * 100) + '%';
    }

    function seekTimeline(e) {
        const pct = e.offsetX / document.getElementById('timeline').offsetWidth;
        currentTick = Math.floor(pct * allEvents.length);
        jumpToTick(currentTick);
    }

    function jumpToTick(t) {
        currentTick = t;
        document.getElementById('lbl-tick').innerText = t;
        updateDVR();
    }

    function toggleStream() {
        isStreamActive = !isStreamActive;
        const btn = document.getElementById('btn-stream');
        btn.innerText = isStreamActive ? "⏸ PAUSE STREAM" : "▶ RESUME STREAM";
        btn.style.borderColor = isStreamActive ? 'var(--neon)' : 'var(--warn)';
        logLedger('SYSTEM', isStreamActive ? 'Stream resumed' : 'Stream paused');
    }

    function clearGraph() {
        if (confirm('Clear all nodes and reset graph?')) {
            nodes.clear();
            edges.clear();
            allEvents = [];
            capsuleCount = 0;
            approvedCount = 0;
            failedCount = 0;
            currentTick = 0;
            heatIntensity = 0;
            updateStats();
            updateDVR();
            updateHeatUI();
            logLedger('SYSTEM', 'Graph cleared');
        }
    }

    function closeInspector() {
        document.getElementById('node-inspector').style.display = 'none';
    }

    // --- 6. INITIALIZE ---
    connectWS();
    
    network.on("click", (params) => {
        if (params.nodes[0]) {
            const data = nodes.get(params.nodes[0]);
            const inspector = document.getElementById('node-inspector');
            const content = document.getElementById('inspector-content');
            
            inspector.style.display = 'block';
            content.innerHTML = `
                <strong>NODE_ID:</strong> ${params.nodes[0]}<br>
                <strong>TYPE:</strong> ${data.label}<br>
                <strong>STATUS:</strong> <span style="color: ${
                    data.status === 'approved' ? 'var(--pass)' : 
                    data.status === 'failed' ? 'var(--fail)' : 
                    'var(--airlock)'
                }">${data.status?.toUpperCase() || 'UNKNOWN'}</span><br>
                <strong>PAYLOAD:</strong>
                <pre>${JSON.stringify(data.payload, null, 2)}</pre>
            `;
        } else {
            closeInspector();
        }
    });

    // Log startup
    logLedger('SYSTEM', 'Sovereign God-View Online. Awaiting Synapse Link...');

</script>
</body>
</html>
